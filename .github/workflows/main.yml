name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  ROM_NAME: Generic
  BUILD_TYPE: ab
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
       - name: Checkout
         uses: actions/checkout@master

       - name: Cleanup
         uses: rokibhasansagar/slimhub_actions@main

       - name: Initialization environment
         run: |
            sudo apt-get update
            sudo apt-get install -y git wget aria2 zip unzip

       - name: Clone ErfanGSI Source Code
         run: git clone --recurse-submodules https://github.com/mi20210630/ErfanGSIs.git ErfanGSIs

       - name: Fix exit
         run: |
              cd $GITHUB_WORKSPACE/ErfanGSIs
              sed -i 's/\|\| exit 1//g' url2GSI.sh
              sed -i 's/exit 1//g' url2GSI.sh
              chmod +x make.sh url2GSI.sh setup.sh update.sh tools/Firmware_extractor/extractor.sh 2>/dev/null || true
              chmod +x scripts/*.sh tools/*.sh tools/Firmware_extractor/tools/*/*.py 2>/dev/null || true
              curl -sL https://raw.githubusercontent.com/erfanoabdi/ErfanGSIs/master/make.sh -o make.sh
              sed -i 's@^    \*"12"\*) flag=true ;;@&\n    *"13"*) flag=true ;;\n    *"14"*) flag=true ;;@' make.sh
              touch roms/13/Generic/DONTRESIGN
              sed -i 's@    fcontexts="$tempdir/file_contexts"@    echo "/(.*)?              u:object_r:rootfs:s0" >> "$tempdir/file_contexts"\n    fcontexts="$tempdir/file_contexts"@' scripts/mkimage.sh
              grep -c "rootfs:s0" scripts/mkimage.sh
              sed -i 's@/ BLOCKSIZE@// BLOCKSIZE@g' tools/mkuserimg_mke2fs.py
              grep -n 'BLOCKSIZE' tools/mkuserimg_mke2fs.py | head -4
              python3 -c "import re; s=open('make.sh').read(); s=re.sub(r'^systemsize=.*$', 'systemsize=\$(( \$(du -sk \$systemdir | cut -f1) * 110 / 100 / 40960 * 40960 * 1024 ))', s, flags=re.M); open('make.sh','w').write(s); print('SIZEPATCH OK')"
              chmod +x make.sh
              grep -n 'systemsize=' make.sh
              bash -n make.sh && echo "MAKE.SH SYNTAX OK"

       - name: Setting up ErfanGSI requirements
         run: |
              cd $GITHUB_WORKSPACE/ErfanGSIs
              mkdir ./output
              sudo apt-get install -y liblzma-dev python3-dev build-essential || true
              sudo apt-get install -y unace unrar zip unzip p7zip-full p7zip-rar sharutils rar uudeview mpack arj cabextract file-roller device-tree-compiler liblzma-dev python3-pip brotli liblz4-tool gawk aria2 || true
              sudo pip3 install --break-system-packages protobuf==3.20.0 pycryptodome || sudo pip3 install --break-system-packages protobuf pycryptodome || true
              sudo pip3 install --break-system-packages backports.lzma || true
              echo 'PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python' >> $GITHUB_ENV
              sudo python3 -c 'from google.protobuf import descriptor; print("PROTO_ROOT_OK")'

       - name: Download Stock Rom & Generate GSI
         run: |
             cd $GITHUB_WORKSPACE/ErfanGSIs
             for i in 00 01 02 03 04 05 06 07 08 09 10 11; do wget -q https://github.com/stairyTOM/ErfanGSIs-build/releases/download/romsrc/part$i.bin; done
             ls -la part*.bin
             cat part00.bin part01.bin part02.bin part03.bin part04.bin part05.bin part06.bin part07.bin part08.bin part09.bin part10.bin part11.bin > rom.zip
             ls -la rom.zip
             sudo bash ./url2GSI.sh -c --$BUILD_TYPE $GITHUB_WORKSPACE/ErfanGSIs/rom.zip $ROM_NAME
             ls -la output/

       - name: Zip GSI
         run: |
              touch info.txt
              echo "Generic MTK A13 build by stairyTOM" >>info.txt
              cd $GITHUB_WORKSPACE/ErfanGSIs/output
              mkdir upload
              zip -r GSI.zip ./*
              if [[ $(du -sb "GSI.zip" | awk '{print $1}') -gt 2097152000 ]];then
                  echo -e "split packaging..."
                  tar -cpzf - "GSI.zip" | split -d -b 1024m - "upload/GSI.zip"
              else
                  mv GSI.zip upload/
              fi
              ls "upload"

       - name: Upload GSI to release
         uses: ncipollo/release-action@v1.8.6
         with:
           artifacts: ${{ github.workspace }}/ErfanGSIs/output/upload/*
           tag: ErfanGSIs-${{ env.ROM_NAME }}-${{ env.BUILD_TYPE }}-${{ github.run_number }}
           bodyFile: "info.txt"
           token: ${{ secrets.GITHUB_TOKEN }}
